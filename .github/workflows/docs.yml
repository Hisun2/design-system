# main에 올릴 때마다 규칙 문서 사이트를 검사하고 GitHub Pages에 올립니다.
name: 문서 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci는 Windows에서 만든 잠금 파일에 Linux용 선택 패키지가 빠져 있어 실패합니다. 그래서 npm install을 씁니다.
      - run: npm install --no-audit --no-fund
      - run: npm run check:docs
      # 사이트 주소가 https://<계정>.github.io/<저장소 이름>/ 이라서 그 경로를 기준으로 빌드합니다.
      - run: npx vite build docs --base=/${{ github.event.repository.name }}/
      # 비공개 저장소(무료 요금제)에서는 Pages를 쓸 수 없으므로 검사와 빌드까지만 합니다.
      - if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
